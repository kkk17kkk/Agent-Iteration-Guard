services:
  backend:
    build: ./backend
    environment:
      AGENTGUARD_DB: /data/agentguard.db
    volumes:
      - agentguard-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  agentguard-data:
